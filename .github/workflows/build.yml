name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack hypno-eye-1.21.1.zip
        run: |
          rm -rf work && mkdir work
          unzip -q hypno-eye-1.21.1.zip -d work
          # project root = folder that contains build.gradle
          ROOT=$(dirname "$(find work -maxdepth 3 -name build.gradle | head -n1)")
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: hypnoeye-jar
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
